[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
stock_vault = "FoVBZRFCamH1HNMiVpNZV2QJxk9bSxWtQvKgmqZ1rVLw"

[programs.devnet]
stock_vault = "FoVBZRFCamH1HNMiVpNZV2QJxk9bSxWtQvKgmqZ1rVLw"

[programs.mainnet]
stock_vault = "FoVBZRFCamH1HNMiVpNZV2QJxk9bSxWtQvKgmqZ1rVLw"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[test.validator]
# agave 3.1.15 panics on a 0.0.0.0 gossip host (UnspecifiedIpAddr); anchor
# defaults to that once a [test.validator] section exists.
bind_address = "127.0.0.1"

# Real mainnet Pyth accounts, captured 2026-09-19, replayed into the local
# validator so on-chain Pyth reads are testable without mainnet.
[[test.validator.account]]
address = "D9uk39pqZMcnmtPP9WeC8cREUpKZmyXLga9mSQ79SphW"
filename = "./fixtures/pyth_equity_aapl.json"

[[test.validator.account]]
address = "4cSM2e6rvbGQUFiJbqytoVMi5GgghSMr8LwVrT9VPSPo"
filename = "./fixtures/pyth_crypto_btc.json"
